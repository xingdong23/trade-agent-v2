[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "trade-agent"
version = "0.1.0"
description = "基于 LangGraph 的美股研究与交易计划 Agent"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116,<1.0",
    "langgraph>=1.0,<2.0",
    "langgraph-checkpoint-sqlite>=3.0,<4.0",
    "PyJWT[crypto]>=2.10,<3.0",
    "pydantic>=2.11,<3.0",
    "pydantic-settings>=2.10,<3.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn>=0.35,<1.0",
]

[project.optional-dependencies]
llm = ["litellm>=1.80,<2.0"]
quant = [
    "lightgbm>=4.6,<5.0",
    "numpy>=2.2,<3.0",
]

[project.scripts]
trade-agent-api = "trade_agent.apps.api:main"
trade-agent = "trade_agent.apps.cli:main"
trade-agent-worker = "trade_agent.apps.worker:main"
trade-agent-db = "trade_agent.apps.db:main"

[dependency-groups]
dev = [
    "mypy>=1.17,<2.0",
    "pytest>=8.4,<10.0",
    "ruff>=0.12,<1.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/trade_agent"]

[tool.pytest.ini_options]
addopts = "-q -m 'not live'"
testpaths = ["tests"]
markers = ["live: 访问真实市场、模型、认证或通知 provider 的显式 smoke test"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src", "tests"]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
allowed-confusables = ["，", "：", "；", "（", "）"]
